name: Validate FedAvg reference

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic test dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run FedAvg unit tests
        run: python -m unittest discover -s tests -v

      - name: Execute reference example
        run: python examples/fedavg_reference.py
