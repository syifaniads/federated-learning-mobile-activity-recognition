<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#ffffff"/>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#1f2937}.title{font-size:34px;font-weight:700}.sub{font-size:16px;fill:#6b7280}.label{font-size:14px;fill:#4b5563}.metric{font-size:26px;font-weight:700}.axis{font-size:12px;fill:#6b7280}.note{font-size:15px;fill:#374151}</style>
  <text x="60" y="55" class="title">IID vs Non-IID Federated Learning</text>
  <text x="60" y="82" class="sub">Group 1 analysis, Non-IID alpha = 0.5</text>

  <g transform="translate(60,120)">
    <rect width="250" height="90" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><text x="20" y="34" class="label">IID final accuracy</text><text x="20" y="70" class="metric">94.71%</text>
  </g>
  <g transform="translate(330,120)">
    <rect width="250" height="90" rx="14" fill="#fff7ed" stroke="#fed7aa"/><text x="20" y="34" class="label">Non-IID final accuracy</text><text x="20" y="70" class="metric">93.45%</text>
  </g>
  <g transform="translate(600,120)">
    <rect width="250" height="90" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/><text x="20" y="34" class="label">Mean EMD - IID</text><text x="20" y="70" class="metric">0.0094</text>
  </g>
  <g transform="translate(870,120)">
    <rect width="250" height="90" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="20" y="34" class="label">Mean EMD - Non-IID</text><text x="20" y="70" class="metric">0.3116</text>
  </g>

  <g transform="translate(110,260)">
    <text x="0" y="0" font-size="22" font-weight="700">Accuracy across selected rounds</text>
    <line x1="0" y1="300" x2="650" y2="300" stroke="#9ca3af"/><line x1="0" y1="35" x2="0" y2="300" stroke="#9ca3af"/>
    <line x1="0" y1="60" x2="650" y2="60" stroke="#e5e7eb"/><line x1="0" y1="140" x2="650" y2="140" stroke="#e5e7eb"/><line x1="0" y1="220" x2="650" y2="220" stroke="#e5e7eb"/>
    <text x="-45" y="64" class="axis">95%</text><text x="-45" y="144" class="axis">92%</text><text x="-45" y="224" class="axis">89%</text>
    <polyline points="40,84 240,70 440,67 620,67" fill="none" stroke="#2563eb" stroke-width="5"/>
    <polyline points="40,226 240,133 440,117 620,111" fill="none" stroke="#f97316" stroke-width="5"/>
    <g fill="#2563eb"><circle cx="40" cy="84" r="6"/><circle cx="240" cy="70" r="6"/><circle cx="440" cy="67" r="6"/><circle cx="620" cy="67" r="6"/></g>
    <g fill="#f97316"><circle cx="40" cy="226" r="6"/><circle cx="240" cy="133" r="6"/><circle cx="440" cy="117" r="6"/><circle cx="620" cy="111" r="6"/></g>
    <g class="axis" text-anchor="middle"><text x="40" y="325">R1</text><text x="240" y="325">R5</text><text x="440" y="325">R10</text><text x="620" y="325">R15</text></g>
    <rect x="120" y="350" width="16" height="5" fill="#2563eb"/><text x="145" y="357" class="label">IID</text><rect x="235" y="350" width="16" height="5" fill="#f97316"/><text x="260" y="357" class="label">Non-IID</text>
  </g>

  <g transform="translate(830,275)">
    <rect width="300" height="255" rx="16" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="20" y="35" font-size="20" font-weight="700">Interpretation</text>
    <text x="20" y="75" class="note">Non-IID clients see skewed</text>
    <text x="20" y="100" class="note">label distributions, so local</text>
    <text x="20" y="125" class="note">updates are less aligned.</text>
    <text x="20" y="165" class="note">Result: slower recovery from</text>
    <text x="20" y="190" class="note">Round 1 and a lower final</text>
    <text x="20" y="215" class="note">accuracy in this experiment.</text>
  </g>

  <text x="60" y="655" class="sub">Source: Group 1 challenge analysis. Visualization reconstructed from reported values.</text>
</svg>