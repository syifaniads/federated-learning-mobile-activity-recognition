    </g>
    <!-- values -->
    <g text-anchor="middle" dominant-baseline="middle">
      <text x="42.5" y="35" class="cell" fill="#fff">492</text><text x="127.5" y="35" class="cell">0</text><text x="212.5" y="35" class="cell">4</text><text x="297.5" y="35" class="cell">0</text><text x="382.5" y="35" class="cell">0</text><text x="467.5" y="35" class="cell">0</text>
