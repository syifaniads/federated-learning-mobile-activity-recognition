      <text x="42.5" y="175" class="cell">8</text><text x="127.5" y="175" class="cell">25</text><text x="212.5" y="175" class="cell" fill="#fff">387</text><text x="297.5" y="175" class="cell">0</text><text x="382.5" y="175" class="cell">0</text><text x="467.5" y="175" class="cell">0</text>
      <text x="42.5" y="245" class="cell">0</text><text x="127.5" y="245" class="cell">3</text><text x="212.5" y="245" class="cell">0</text><text x="297.5" y="245" class="cell" fill="#fff">430</text><text x="382.5" y="245" class="cell">58</text><text x="467.5" y="245" class="cell">0</text>
      <text x="42.5" y="315" class="cell">0</text><text x="127.5" y="315" class="cell">0</text><text x="212.5" y="315" class="cell">0</text><text x="297.5" y="315" class="cell">27</text><text x="382.5" y="315" class="cell" fill="#fff">505</text><text x="467.5" y="315" class="cell">0</text>
      <text x="42.5" y="385" class="cell">0</text><text x="127.5" y="385" class="cell">0</text><text x="212.5" y="385" class="cell">0</text><text x="297.5" y="385" class="cell">0</text><text x="382.5" y="385" class="cell">14</text><text x="467.5" y="385" class="cell" fill="#fff">523</text>
    </g>
    <!-- row labels -->
    <g text-anchor="end" class="axis"><text x="-12" y="40">WALKING</text><text x="-12" y="110">UPSTAIRS</text><text x="-12" y="180">DOWNSTAIRS</text><text x="-12" y="250">SITTING</text><text x="-12" y="320">STANDING</text><text x="-12" y="390">LAYING</text></g>
    <g text-anchor="middle" class="axis"><text x="42.5" y="445">WALK</text><text x="127.5" y="445">UP</text><text x="212.5" y="445">DOWN</text><text x="297.5" y="445">SIT</text><text x="382.5" y="445">STAND</text><text x="467.5" y="445">LAY</text></g>
  </g>

  <g transform="translate(835,300)">
    <text x="0" y="0" font-size="22" font-weight="700">Accuracy by round</text>
    <line x1="0" y1="310" x2="300" y2="310" stroke="#9ca3af"/><line x1="0" y1="40" x2="0" y2="310" stroke="#9ca3af"/>
    <polyline points="10,282 40,176 70,92 100,82 130,80 160,89 190,63 220,82 250,69 280,76" fill="none" stroke="#7c3aed" stroke-width="4"/>
    <g fill="#7c3aed"><circle cx="10" cy="282" r="5"/><circle cx="40" cy="176" r="5"/><circle cx="70" cy="92" r="5"/><circle cx="100" cy="82" r="5"/><circle cx="130" cy="80" r="5"/><circle cx="160" cy="89" r="5"/><circle cx="190" cy="63" r="5"/><circle cx="220" cy="82" r="5"/><circle cx="250" cy="69" r="5"/><circle cx="280" cy="76" r="5"/></g>
    <text x="0" y="335" class="small">Round 1</text><text x="255" y="335" class="small">Round 10</text>
    <text x="6" y="300" class="small">90.06%</text><text x="195" y="55" class="small">94.01%</text>
    <text x="0" y="380" class="sub">Rapid early improvement, then small oscillation near convergence.</text>
  </g>

  <text x="60" y="855" class="small">Source values: final course report. Visualization reconstructed for the public portfolio; no lab infrastructure identifiers included.</text>
</svg>