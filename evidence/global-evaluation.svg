<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#ffffff"/>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#1f2937}.title{font-size:34px;font-weight:700}.sub{font-size:16px;fill:#6b7280}.metric{font-size:28px;font-weight:700}.label{font-size:14px;fill:#4b5563}.cell{font-size:15px;font-weight:600}.axis{font-size:12px;fill:#6b7280}.small{font-size:12px;fill:#6b7280}
  </style>
  <text x="60" y="55" class="title">Global Federated Learning Evaluation</text>
  <text x="60" y="82" class="sub">Portfolio reconstruction from values reported in the final course report</text>

  <g transform="translate(60,115)">
    <rect width="240" height="95" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><text x="20" y="38" class="label">Accuracy</text><text x="20" y="73" class="metric">94.23%</text>
  </g>
  <g transform="translate(320,115)">
    <rect width="240" height="95" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/><text x="20" y="38" class="label">F1 Macro</text><text x="20" y="73" class="metric">0.9424</text>
  </g>
  <g transform="translate(580,115)">
    <rect width="240" height="95" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/><text x="20" y="38" class="label">Log Loss</text><text x="20" y="73" class="metric">0.1522</text>
  </g>
  <g transform="translate(840,115)">
    <rect width="240" height="95" rx="14" fill="#fffbeb" stroke="#fde68a"/><text x="20" y="38" class="label">Test Samples</text><text x="20" y="73" class="metric">2,947</text>
  </g>

  <text x="60" y="265" font-size="22" font-weight="700">Confusion matrix</text>
  <g transform="translate(255,295)">
    <!-- cells: 85 x 70 -->
    <g>
      <rect x="0" y="0" width="85" height="70" fill="#1d4ed8"/><rect x="85" y="0" width="85" height="70" fill="#f8fafc"/><rect x="170" y="0" width="85" height="70" fill="#dbeafe"/><rect x="255" y="0" width="85" height="70" fill="#f8fafc"/><rect x="340" y="0" width="85" height="70" fill="#f8fafc"/><rect x="425" y="0" width="85" height="70" fill="#f8fafc"/>
      <rect x="0" y="70" width="85" height="70" fill="#bfdbfe"/><rect x="85" y="70" width="85" height="70" fill="#2563eb"/><rect x="170" y="70" width="85" height="70" fill="#eff6ff"/><rect x="255" y="70" width="85" height="70" fill="#f8fafc"/><rect x="340" y="70" width="85" height="70" fill="#eff6ff"/><rect x="425" y="70" width="85" height="70" fill="#f8fafc"/>
      <rect x="0" y="140" width="85" height="70" fill="#dbeafe"/><rect x="85" y="140" width="85" height="70" fill="#bfdbfe"/><rect x="170" y="140" width="85" height="70" fill="#3b82f6"/><rect x="255" y="140" width="85" height="70" fill="#f8fafc"/><rect x="340" y="140" width="85" height="70" fill="#f8fafc"/><rect x="425" y="140" width="85" height="70" fill="#f8fafc"/>
      <rect x="0" y="210" width="85" height="70" fill="#f8fafc"/><rect x="85" y="210" width="85" height="70" fill="#dbeafe"/><rect x="170" y="210" width="85" height="70" fill="#f8fafc"/><rect x="255" y="210" width="85" height="70" fill="#2563eb"/><rect x="340" y="210" width="85" height="70" fill="#93c5fd"/><rect x="425" y="210" width="85" height="70" fill="#f8fafc"/>
      <rect x="0" y="280" width="85" height="70" fill="#f8fafc"/><rect x="85" y="280" width="85" height="70" fill="#f8fafc"/><rect x="170" y="280" width="85" height="70" fill="#f8fafc"/><rect x="255" y="280" width="85" height="70" fill="#bfdbfe"/><rect x="340" y="280" width="85" height="70" fill="#1d4ed8"/><rect x="425" y="280" width="85" height="70" fill="#f8fafc"/>
