<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#ffffff"/>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#1f2937}.title{font-size:34px;font-weight:700}.sub{font-size:16px;fill:#6b7280}.axis{font-size:12px;fill:#6b7280}.label{font-size:14px;fill:#4b5563}.metric{font-size:22px;font-weight:700}.note{font-size:14px;fill:#374151}</style>
  <text x="60" y="55" class="title">Convergence and Communication Trade-offs</text>
  <text x="60" y="82" class="sub">Group 1 Challenge 4 analysis</text>

  <g transform="translate(70,125)">
    <rect width="510" height="530" rx="18" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="25" y="42" font-size="22" font-weight="700">A. Local epochs (E)</text>
    <text x="25" y="70" class="label">More local work increased runtime without improving final accuracy in this run.</text>
    <line x1="55" y1="360" x2="455" y2="360" stroke="#9ca3af"/><line x1="55" y1="120" x2="55" y2="360" stroke="#9ca3af"/>
    <!-- accuracy bars -->
    <rect x="82" y="151" width="45" height="209" fill="#2563eb" rx="4"/><rect x="157" y="158" width="45" height="202" fill="#3b82f6" rx="4"/><rect x="232" y="162" width="45" height="198" fill="#60a5fa" rx="4"/><rect x="307" y="165" width="45" height="195" fill="#93c5fd" rx="4"/><rect x="382" y="174" width="45" height="186" fill="#bfdbfe" rx="4"/>
    <g class="axis" text-anchor="middle"><text x="104" y="385">E=1</text><text x="179" y="385">E=5</text><text x="254" y="385">E=10</text><text x="329" y="385">E=20</text><text x="404" y="385">E=50</text></g>
    <g class="label" text-anchor="middle"><text x="104" y="140">94.33%</text><text x="179" y="147">94.06%</text><text x="254" y="151">93.89%</text><text x="329" y="154">93.76%</text><text x="404" y="163">93.42%</text></g>
    <text x="25" y="430" class="metric">Runtime: 0.40s → 15.68s</text>
    <text x="25" y="462" class="note">Communication estimate remained 2.06 MB under the challenge's accounting.</text>
    <text x="25" y="493" class="note">Source conclusion: E=1 was the most efficient configuration in this experiment.</text>
  </g>

  <g transform="translate(620,125)">
    <rect width="510" height="530" rx="18" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="25" y="42" font-size="22" font-weight="700">B. Partial client participation</text>
    <text x="25" y="70" class="label">Reducing participants saves communication but can increase variance.</text>
    <line x1="55" y1="360" x2="455" y2="360" stroke="#9ca3af"/><line x1="55" y1="120" x2="55" y2="360" stroke="#9ca3af"/>
    <polyline points="95,272 195,161 295,153 395,169" fill="none" stroke="#7c3aed" stroke-width="5"/>
    <g fill="#7c3aed"><circle cx="95" cy="272" r="7"/><circle cx="195" cy="161" r="7"/><circle cx="295" cy="153" r="7"/><circle cx="395" cy="169" r="7"/></g>
    <g class="axis" text-anchor="middle"><text x="95" y="385">25%</text><text x="195" y="385">50%</text><text x="295" y="385">75%</text><text x="395" y="385">100%</text></g>
    <g class="label" text-anchor="middle"><text x="95" y="258">91.89%</text><text x="195" y="147">94.03%</text><text x="295" y="139">94.06%</text><text x="395" y="155">93.89%</text></g>
    <text x="25" y="430" class="metric">Selected stable minimum: 75%</text>
    <text x="25" y="462" class="note">3 of 4 clients; variance reported as 2.6e-7 over the last 5 rounds.</text>
    <text x="25" y="493" class="note">Estimated communication: 1.54 MB vs 2.06 MB at full participation.</text>
  </g>

  <text x="60" y="715" class="sub">Visualization reconstructed from the values reported in the original Group 1 Challenge 4 analysis.</text>
</svg>